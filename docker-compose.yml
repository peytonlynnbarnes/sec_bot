version: '3.8'
services:
  sec_bot:
    build:
      context: .
      dockerfile: Dockerfile  # This now points to our Ubuntu 22.04 Dockerfile
    image: sec_bot_image
    container_name: sec_bot_container
    privileged: true
    network_mode: host
    volumes:
      # Persist ROS workspace
      - ros_workspace:/ros2_ws/src
      # Mount project directory for development
      - ./:/sec_bot
      # Allow X11 forwarding for GUI apps
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Device access
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - ROS_DISTRO=humble  # Added to explicitly set ROS distro to Humble
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"  # Microcontroller device mapping
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  ros_workspace:
